<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ML inference for physical systems — Re-thinking how operational insight is delivered. Deployable, scalable, and trusted inference systems for flow, state, and condition." />
  <title>Phluux</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Top nav -->
  <div class="topbar">
    <div class="wrap">
      <div class="nav">
        <a class="brand" href="#home" data-page="home" aria-label="Home">
          <img src="assets/logo-bright.png" alt="Phluux logo" />
        </a>

        <div class="links">
          <span class="navlink" data-page="home">Home</span>
          <span class="navlink" data-page="platform">Our Platform</span>
          <span class="navlink" data-page="deployment">Architecture</span>
          <span class="navlink" data-page="solutions">Services</span>
          <span class="navlink" data-page="about">About</span>
          <span class="navlink" data-page="contact">Contact</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Pages injected here -->
  <div id="pages"></div>

  <!-- Lightbox for welcome screenshot (always in DOM) -->
  <div id="welcomeLightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Phluux Studio welcome screenshot">
    <div class="lightboxBackdrop" data-lightbox-close></div>
    <div class="lightboxContent">
      <button type="button" class="lightboxClose" data-lightbox-close aria-label="Close">✕</button>
      <img src="assets/welcome.png" alt="Phluux Studio welcome page (full size)" />
    </div>
  </div>

  <footer>
    <div class="wrap">
      <div class="footerRow">
        <div class="fine">© <span id="y"></span> Phluux LLC</div>
        <div class="fine">thephluux.com</div>
      </div>
    </div>
  </footer>

  <script src="app.js?v=4"></script>
</body>
</html>
